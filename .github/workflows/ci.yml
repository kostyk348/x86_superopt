name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the sibling sdre crate (path dependency)
        run: git clone --depth 1 https://github.com/kostyk348/sdre.git ../sdre
      - name: Build
        run: cargo build --verbose
